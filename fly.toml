app = 'fly-io-test-bgk8uw'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 7500
    soft_limit = 5000

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
